  series: ["var(--accent)", "var(--quiet)"],
};

// Slat types: the scale, numbered over and under the rack, and one album: its rank and name, its discs, its sales
const Mark = slat({
  room: { before: 26, after: 26 },
  css: `
    .line { --rhp-tick-width: 1px; }
    .num { --rhp-label-gap: 0px; translate: -50% 0; font-size: 11px; color: var(--rhp-muted); }
    .over { top: -20px; }
    .first { translate: 0 0; }
    .under { top: calc(100% + 8px); }
  `,
}, (t) => html`
  <div>
    <${Tick} class="line" at=${() => t.at} thick=${1} color="grid" />
    <${Label} class=${() => (t.first ? "num over first" : "num over")} at=${() => t.at}>${() => (t.at === 0 ? "0" : `${t.at}M`)}<//>
    <${Label} class=${() => (t.first ? "num under first" : "num under")} at=${() => t.at}>${() => (t.at === 0 ? "0" : `${t.at}M`)}<//>
  </div>`);

// One album, two ways: from 900px its name beside its discs; narrower, its name over them, so the discs keep the width.
// The rooms are in px (a 200-slat chart lays out faster that way), so each way is its own slat type.
const ALBUM_CSS = `
  .album { cursor: default; }
  .album:focus-visible { outline: 2px solid var(--rhp-ink); outline-offset: -2px; border-radius: 3px; }
  .no { display: inline-block; width: 2.1em; margin-right: .7em; text-align: right; color: var(--rhp-muted); font-variant-numeric: tabular-nums; }
  .by { color: var(--rhp-muted); }
  .discs { --rhp-radius: 0px;
    mask: radial-gradient(circle closest-side, #0000 19%, #000 27% 82%, #0000 89%) 0 50% / calc(100% / var(--n)) 100% repeat-x; }
  .value { font-size: 11.5px; color: var(--rhp-muted); }
  .lit .discs { background: var(--rhp-series-1); }
  .lit :is(.name, .no, .by, .value) { color: var(--rhp-series-1); }
`;
const name = (d) => html`<span class="no">${() => d.rank}</span>${() => d.title}<span class="by">${" · "}${() => d.artist}</span>`;
const sold = (d) => html`
  <${Bar} to=${() => d.sales} class="discs" color="series-2" style=${() => ({ "--n": d.discs })} />
  <${Label} at=${() => d.sales} class="value">${() => `${millions.format(d.sales)}M`}<//>`;
const AlbumWide = slat({
  thickness: 20,
  inset: "4px",
  room: { start: NAME_ROOM, end: 48 },
  css: [ALBUM_CSS, `
    .name { font-size: 12.5px; }
    .nm { display: block; width: ${NAME_ROOM - 8}px; text-align: left; white-space: nowrap; } /* the room less rhp's 8px gap: names start in one column */
  `],
}, (d) => html`
  <div class=${() => (d.lit ? "album lit" : "album")} data-row=${() => d.index} aria-label=${() => say(d)}>
    <${Label} edge="start" class="name"><span class="nm">${name(d)}</span><//>
    ${sold(d)}
  </div>`);
const AlbumNarrow = slat({
  thickness: 36,
  inset: "13px",
  room: { start: 2, end: 48 },
  css: [ALBUM_CSS, `
    /* The name runs over the discs and on into the room past them (48px), to the chart's edge */
    .name { position: absolute; left: 0; top: 0; max-width: calc(100% + 48px); overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; line-height: 12px; white-space: nowrap; }
    .no { width: 2em; margin-right: .3em; text-align: left; }
    .value { font-size: 11px; }
  `],
}, (d) => html`
  <div class=${() => (d.lit ? "album lit" : "album")} data-row=${() => d.index} aria-label=${() => say(d)}>
    <span class="name" aria-hidden="true">${name(d)}</span>
    ${sold(d)}
  </div>`);
const narrowScreen = matchMedia("(max-width: 899px)"); // the poster's own breakpoint
const [narrow, setNarrow] = createSignal(narrowScreen.matches);
narrowScreen.addEventListener("change", (e) => setNarrow(e.matches));

// Chart component: the app holds what the reader typed and which album they picked
function AlbumRack() {
  const [query, setQuery] = createSignal("");
  const [picked, setPicked] = createSignal(null);
  const [perMillion, setPerMillion] = createSignal(0); // px along the plot for a million copies
  let deck, stage, input;

  // The albums that match, in rank order, and each row's place on screen (null hides it)
  const matches = createMemo(() => {
    const words = fold(query()).split(/\s+/).filter(Boolean);
    return ALBUMS.flatMap((_, i) => (words.every((w) => KEYS[i].includes(w)) ? [i] : []));
  });
  const places = createMemo(() => {
    const p = ALBUMS.map(() => null);
    matches().forEach((i, k) => (p[i] = k));
    return p;
  });
  // The album on the record: the one picked, or else the first one shown (No. 1 at rest)
  const lit = createMemo(() => {
    const p = picked();
    return p != null && places()[p] != null ? p : matches()[0] ?? null;
  });
  const shown = () => (lit() == null ? null : ALBUMS[lit()]);
  const unit = createMemo(() => UNITS.find((u) => u * perMillion() >= MIN_DISC) ?? UNITS[UNITS.length - 1]);
  const count = () => {
    const n = matches().length;
    return !query().trim() ? `${N} albums` : n === 0 ? `None of ${N} match` : `${n} of ${N} match`;
  };

  // The row of the slat an element is in, or null (between slats, on the deck or the text)
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A mouse or a pen picks as it moves, a tap or a click picks, the keyboard picks; on no slat the pick stays
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setPicked(row);
  };
  // Leaving the poster: back to the slat that has focus (a keyboard's or a click's pick), or none
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    setPicked(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  // Typing narrows the rack; when the reader is down in it, the results come up under the deck
  const search = (text) => {
    setQuery(text);
    setPicked(null);
    const gap = stage.getBoundingClientRect().top - deck.getBoundingClientRect().bottom;
    if (gap < 0) window.scrollBy(0, gap);
  };
  // Enter or the down arrow goes to the first album found; Escape empties the field
  const keys = (e) => {
    if ((e.key === "Enter" || e.key === "ArrowDown") && matches().length) {
      e.preventDefault();
      stage.querySelector(`[data-row="${matches()[0]}"]`)?.focus();
    } else if (e.key === "Escape" && input.value) {
      e.preventDefault();
      input.value = "";
      search("");
    }
  };

  // The plot's width sets the disc's unit (measured between the scale's first and last lines, once rhp has placed
  // them); the deck's height keeps an album the keyboard reaches clear of the deck
  const measure = () => {
    const xs = [...stage.querySelectorAll(".rhp-scale .line")].map((el) => {
      const r = el.getBoundingClientRect();
      return r.left + r.width / 2;
    });
    if (xs.length > 1) setPerMillion((Math.max(...xs) - Math.min(...xs)) / (SCALE.ticks[SCALE.ticks.length - 1] - SCALE.ticks[0]));
    document.documentElement.style.scrollPaddingTop = `${deck.offsetHeight + 8}px`;
  };
  let watch, frame;
  onMount(() => {
    watch = new ResizeObserver(() => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => (frame = requestAnimationFrame(measure)));
    });
    watch.observe(stage);
    watch.observe(deck);
  });
  onCleanup(() => {
    watch?.disconnect();
    cancelAnimationFrame(frame);
  });

  // The rack of albums, drawn by either slat type
  const rack = (type) => html`
    <${Plot} rows=${ALBUMS} order=${places} keyboard=${true}
      lit=${(d) => lit() === d.index} discs=${(d) => Math.max(1, Math.round(d.sales / unit()))}>${type}<//>`;

  const headline = N === 0 ? "No albums to show yet"
    : N === 1 ? html`<em>${TOP.title}</em> has sold ${millions.format(TOP.sales)} million copies`
    : millions.format(LEAD) !== "0"
    ? html`<em>${TOP.title}</em> leads the <span class="nobr">all-time</span> list by ${millions.format(LEAD)} million copies`
    : html`<em>${TOP.title}</em> shares the top of the all-time list`;

  return html`
    <${Poster}
      kicker="All-time album sales"
      title=${headline}
      dek=${() => `The ${N} best-selling albums of all time, by copies sold worldwide; each disc is ${unitWords(unit())}. Find an album, or point at, tap or Tab to one.`}
      note=${NOTE}
      onPointerMove=${(e) => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setPicked(null)}>
      <div class="deck" ref=${(el) => (deck = el)}>
        <div class="find">
          <div class="find-head">
            <label for="find">Find an album</label>
            <span class="count" id="find-count" aria-live="polite">${count}</span>
          </div>
          <div class="field">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
            <input id="find" type="search" placeholder="Title or artist" autocomplete="off" spellcheck="false" aria-describedby="find-count"
              ref=${(el) => (input = el)} onInput=${(e) => search(e.currentTarget.value)} onKeyDown=${keys}>
          </div>
        </div>
        <div class=${() => (shown() ? "now" : "now empty")} aria-hidden="true">
          <div class="record"></div>
          <span class="meta">${() => (shown() ? `No. ${shown().rank}` : "No match")}</span>
          <span class="title">${() => (shown() ? shown().title : N ? `“${query().trim()}”` : "")}</span>
          <span class="by">${() => (shown() ? `${shown().artist}, ${shown().year}` : (N ? `Not in any title or artist of the ${N}` : "The list is empty"))}</span>
          <span class="sold">${() => (shown() ? html`<b>${millions.format(shown().sales)}</b><span>million copies</span>` : "")}</span>
        </div>
      </div>
      <div class="stage" ref=${(el) => (stage = el)}>
        <${Chart} scale=${[SCALE.min, SCALE.max]} theme=${THEME}
          label=${`The ${N} best-selling albums of all time, copies sold in millions (illustrative)`}>
          <${Scale} ticks=${SCALE.ticks}>${Mark}<//>
          <${Show} when=${narrow} fallback=${() => rack(AlbumWide)}>${() => rack(AlbumNarrow)}<//>
        <//>
      </div>
    <//>`;
}

render(() => html`<${AlbumRack} />`, document.getElementById("chart"));
</script>
</body>
</html>
