  /* Tokens: the wine velvet of a sales plaque, warm white engraving, gold for the album in focus,
     platinum discs for the rest, and the brass of the plaque's plate */
  :root {

    --accent: #f3c65a; --quiet: #a3878f;
    --brass: #d8b25c; --brass-ink: #2b1906; --brass-soft: #5b3f12; --brass-well: #f4e3b8;

  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px; background: var(--page); }

  /* The poster: velvet under a soft light, framed by a gold hairline */
  .poster { display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; padding: 50px 44px 30px;
    color: var(--ink); font: 16px/1.5 var(--text);
    background: radial-gradient(120% 60% at 20% 0%, #5a2033, transparent 70%), var(--paper);
    box-shadow: inset 0 0 0 10px var(--paper), inset 0 0 0 11px #8c5a3a; }
  .poster figcaption { display: contents; }
  .poster .kicker { font: 600 12px/1.3 var(--text); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .poster .headline { margin-top: 12px; max-width: 15em; font: 600 clamp(32px, 6vw, 50px)/1.02 var(--display); text-wrap: balance; }
  .poster .headline em { font-style: italic; color: var(--accent); }
  .poster .dek { margin-top: 14px; max-width: 54ch; font-size: 16px; line-height: 1.5; color: var(--soft); }
  .poster .note { display: block; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12px; line-height: 1.5; color: var(--soft); }
  /* In one column the plate is pinned to the top of the screen: a slat scrolled into view (by the search or the
     keyboard) keeps clear of it */
  .stage { min-width: 0; --album-margin-top: 110px; }
  .empty { margin: 0; color: var(--soft); }

  /* The brass plate: the search, and the album in focus engraved under it */
  .plate { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 6px 24px; margin: 24px -14px 16px; padding: 12px 16px;
    background: var(--brass); color: var(--brass-ink); border-radius: 2px;
    box-shadow: inset 0 0 0 1px #f0d68f, inset 0 0 0 2px #a8853a, 0 8px 14px -8px #1a0509; }
  .find { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-content: start; gap: 4px 6px; }
  .find-head { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .find-head .count { letter-spacing: .04em; font-variant-numeric: tabular-nums; color: var(--brass-soft); text-transform: none; font-weight: 600; }
  .find input { width: 100%; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid #8a6a28; border-radius: 2px; background: var(--brass-well); color: var(--brass-ink); font: 500 16px/1 var(--text); }
  .find input::placeholder { color: #6e5220; opacity: 1; }
  .find button { width: 36px; height: 36px; padding: 0; border: 1px solid #8a6a28; border-radius: 2px; background: var(--brass-well); color: var(--brass-ink); font: 700 17px/1 var(--text); cursor: pointer; }
  .find button:disabled { cursor: default; background: none; color: #7a5e24; border-color: #a8853a; }
  .plate :focus-visible { outline: 2px solid var(--brass-ink); outline-offset: 2px; }
  /* The title takes up to two lines, and the plate keeps room for two (2.24em at the title's size), so it never changes height */

  .say .no { grid-row: span 3; align-self: start; margin-top: 4px; font: 700 44px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
  .say .no small { display: block; font: 700 11px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; text-align: center; }
  .say span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .say .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; align-self: end; white-space: normal; font: italic 700 1em/1.12 var(--display); }
  .say .by, .say .sold { font-size: 14px; line-height: 1.35; }
  .say .sold { font-weight: 700; font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* From 1220px: the words and the plate in a rail beside the list, the plate pinned as the list scrolls */
  @media (min-width: 1220px) {
    .poster { display: grid; max-width: 1240px; padding: 60px 52px 32px; column-gap: 52px;
      grid-template-columns: 330px minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto;
      grid-template-areas: "kicker stage" "headline stage" "dek stage" "plate stage" "note note"; }
    .poster .kicker { grid-area: kicker; }
    .poster .headline { grid-area: headline; font-size: 38px; }
    .poster .dek { grid-area: dek; }
    .poster .note { grid-area: note; }
    .stage { grid-area: stage; --album-margin-top: 24px; }
    .plate { grid-area: plate; align-self: start; top: 24px; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 28px 0 0; padding: 16px 16px 14px; }
    .say { padding-top: 12px; border-top: 1px solid #a8853a; }
  }

    .stage { --album-pitch: 46px; --album-margin-top: 160px; } /* a slat's name may take two lines on a phone */
    body { padding: 16px 16px 32px; }
    .poster { padding: 30px 18px 20px; box-shadow: inset 0 0 0 6px var(--paper), inset 0 0 0 7px #8c5a3a; }
    .poster .dek { font-size: 15px; }
    .plate { grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 18px -8px 12px; padding: 10px 10px; }
    .find input, .find button { height: 34px; }
    .find button { width: 34px; }
    /* The plate stays as short as it can on a phone: the label is read out but not shown, and the count sits in the box */
    .find { position: relative; }
    .find-head { position: absolute; top: 0; left: 0; right: 80px; height: 34px; align-items: center; padding: 0 10px; pointer-events: none; }
    .find-head .find-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .find-head .count { margin-left: auto; }
    .find input:not(:placeholder-shown) { padding-right: 70px; }

    .say { column-gap: 0; font-size: 17px; }
    .say .t { grid-area: 1 / 1 / 2 / -1; }
    .say .by { grid-area: 2 / 1 / 3 / -1; }
    .say .no { grid-area: 3 / 1; align-self: center; margin: 0; font: 700 13px/1.35 var(--text); }
    .say .no small { display: inline; font: inherit; letter-spacing: 0; text-transform: none; }
    .say .sold { grid-area: 3 / 2; }
    .say .sold::before { content: "\00a0· "; }
    .say .by, .say .sold { font-size: 13px; }

  : GAP === 0 ? html`${ROWS.filter((r) => r.rank === 1).length} albums share the top spot, with ${millions.format(FIRST.copies)} million copies each`
  : html`<em>${FIRST.title}</em> leads all albums by ${millions.format(GAP)} million copies`;
// Fine steps: no axis is drawn, so the scale only needs a little headroom (and some length when every value is 0)
const scale = nice(0, Math.max(...ROWS.map((r) => r.copies), 0) || 1, 10);
const LISTED = ROWS.length === 1 ? "the one album listed" : `the ${ROWS.length} best-sellers`;
const rankOf = (r) => (r.shared > 1 ? `=${r.rank}` : `${r.rank}`);
const say = (r) => `No. ${r.rank}${r.shared > 1 ? `, shared by ${r.shared} albums` : ""}: ${r.title} by ${r.artist}, ${r.year}. ${millions.format(r.copies)} million copies.`;

// The chart's font and colors, read from the page's tokens: gold for the album in focus, platinum for the rest
const THEME = { font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)", series: ["var(--accent)", "var(--quiet)"] };

// Slat type: an album is its rank, its title and artist, and below them a row of discs, one disc per unit of copies.
// A mask cuts the bar into tiles of one unit each from its start, a disc with its spindle hole in each: every full
// disc is the same, and the last one is cut to what is left, so the bar keeps its exact length.
const Album = slat({
  thickness: "var(--album-pitch, 32px)", // 46px on a phone (page CSS), where a long name takes two lines
  room: { start: 50, end: 44 },
  css: `
    .album { cursor: default; outline: none; scroll-margin: var(--album-margin-top, 24px) 0 24px; }
    .album::before { content: ""; position: absolute; inset: 0 calc(-1 * var(--rhp-room-end, 0px)) 0 calc(-1 * var(--rhp-room-start, 0px)); border-radius: 3px; }
    .lit::before { background: color-mix(in oklab, var(--rhp-series-1) 10%, transparent); }
    .album:focus-visible::before { box-shadow: inset 0 0 0 2px var(--rhp-ink); }
    .miss { opacity: .32; }
    .no { --rhp-label-size: 17px; font: 700 17px/1 "Cormorant Garamond", Georgia, serif; font-variant-numeric: lining-nums tabular-nums; color: var(--rhp-muted); }
    .line { position: absolute; bottom: 16px; left: 0; right: calc(-1 * var(--rhp-room-end, 0px)); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      font-size: 13px; line-height: 14px; color: var(--rhp-muted); }
    .line b { font-weight: 600; color: var(--rhp-ink); }
    .discs { top: auto; bottom: 5px; translate: 0 0; --rhp-radius: 0px; --tile: 0 50% / calc(100% * var(--unit)) 100% repeat-x;
      background: radial-gradient(circle closest-side, color-mix(in oklab, var(--rhp-color) 45%, var(--rhp-surface)) 40%, var(--rhp-color) calc(40% + .5px)) var(--tile), var(--rhp-color);
      -webkit-mask: radial-gradient(circle closest-side, #0000 12%, #000 calc(12% + .5px) 82%, #0000 calc(82% + .6px)) var(--tile);
      mask: radial-gradient(circle closest-side, #0000 12%, #000 calc(12% + .5px) 82%, #0000 calc(82% + .6px)) var(--tile); }
    .value { top: auto; bottom: 3px; translate: 0 0; --rhp-label-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lit .no, .lit .line b, .lit .value { color: var(--rhp-series-1); }
    /* On a phone (the page's breakpoint, where slats are 46px) the name runs over the rank's room too, on two lines
       when it is long, and the rank goes beside the discs */
    @media (max-width: 640px) {
      .line { left: calc(-1 * var(--rhp-room-start, 0px)); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; white-space: normal; font-size: 12px; line-height: 13px; }
      .no { top: auto; bottom: 2px; translate: 0 0; --rhp-label-size: 15px; font-size: 15px; }
    }
  `,
}, (d) => html`
  <div class=${() => (d.lit ? "album lit" : d.miss ? "album miss" : "album")} data-row=${() => d.index} aria-label=${() => say(d)}>
    <${Label} edge="start" class="no" aria-hidden="true">${() => rankOf(d)}<//>
    <span class="line" aria-hidden="true"><b>${() => d.title}</b>${" "}· ${() => d.artist}</span>
    <${Bar} to=${() => d.copies} thick="10px" class="discs" color=${() => (d.lit ? "series-1" : "series-2")} style=${() => ({ "--unit": d.copies > 0 ? d.unit / d.copies : 1 })} />
    <${Label} at=${() => d.copies} class="value" aria-hidden="true">${() => millions.format(d.copies)}<//>
  </div>`);

// Chart component: the reader's pick (pointer, tap or keyboard) and the search are the app's state
function BestSellers() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [on, setOn] = createSignal(null); // the album picked by pointer, tap or keyboard
  const [query, setQuery] = createSignal("");
  const [cursor, setCursor] = createSignal(0); // which of the matches is in focus
  // Matches: every word typed is in the title or the artist, or the number typed is the rank
  const matches = createMemo(() => {
    const q = fold(query()).trim();
    if (!q) return [];
    const words = q.split(/\s+/);
    return ROWS.filter((r) => (/^\d+$/.test(q) && +q === r.rank) || words.every((w) => r.words.includes(w))).map((r) => r.index);
  });
  const matched = createMemo(() => new Set(matches()));
  const found = () => (matches().length ? matches()[Math.min(cursor(), matches().length - 1)] : null);
  const shown = () => on() ?? found() ?? LEAD;
  const album = () => ROWS[shown()] ?? { rank: 0, shared: 1, title: "No album yet", artist: "", year: "", copies: 0 };

  // One disc per unit: a million copies where the plot gives a million 8px or more, a round multiple where it does not
  let plot;
  const [width, setWidth] = createSignal(0);
  const unit = createMemo(() => {
    const px = width() / (scale.max - scale.min);
    return px ? [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50].find((u) => u * px >= 8) ?? 100 : 1;
  });
  const unitText = () => (unit() === 1 ? "a million copies" : unit() < 1 ? `${millions.format(unit() * 1e6)} copies` : `${unit()} million copies`);
  onMount(() => {
    if (!plot) return; // no albums, no chart
    setWidth(plot.clientWidth);
    const watch = new ResizeObserver(() => setWidth(plot.clientWidth));
    watch.observe(plot);
    onCleanup(() => watch.disconnect());
  });

  // A search or a step through its matches brings the album in focus to the middle of the screen
  const reveal = () => {
    const i = found();
    if (i == null) return;
    plot.querySelector(`[data-row="${i}"]`)?.scrollIntoView({ block: "center", behavior: still ? "auto" : "smooth" });
  };
  // While the reader types, the list scrolls once they pause, not to every match on the way
  let typing;
  onCleanup(() => clearTimeout(typing));
  const search = (text) => {
    setQuery(text);
    setCursor(0);
    setOn(null);
    clearTimeout(typing);
    typing = setTimeout(reveal, 250);
  };
  const step = (by) => {
    const n = matches().length;
    if (n < 2) return;
    clearTimeout(typing);
    setCursor((cursor() + by + n) % n);
    setOn(null);
    reveal();
  };
  const keys = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      step(e.shiftKey ? -1 : 1);
    } else if (e.key === "Escape" && e.currentTarget.value) {
      e.preventDefault();
      e.currentTarget.value = "";
      search("");
    }
  };
  const count = () => (!query().trim() ? "" : matches().length ? `${cursor() + 1} of ${matches().length}` : "No match");
  const status = () => {
    if (!query().trim()) return "";
    if (!matches().length) return `No album, artist or rank matches “${query().trim()}”.`;
    return `Match ${cursor() + 1} of ${matches().length}. ${say(ROWS[found()])}`;
  };

  // The row of the slat an element is in, or null (between slats, on the plate or the text)
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A mouse or a pen picks as it moves, a tap or a click picks, the keyboard picks; on no slat the pick stays
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setOn(row);
  };
  // Leaving the poster: back to the slat that has focus (a keyboard's or a click's pick), or to the search's album
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    setOn(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  // Pointing: on the chart, a mouse or a pen picks as above; anywhere else on the poster, it is as if it had left it
  const move = (e) => e.pointerType !== "touch" && (e.target.closest?.(".stage") ? pick(e) : leave(e));

  return html`
    <${Poster}
      kicker="The best-selling albums of all time"
      title=${HEADLINE}
      dek=${() => `Copies sold worldwide by ${LISTED} of an invented catalog, one disc for every ${unitText().replace(/^a /, "")}. Search for an album, point at one, tap it, or Tab into the list.`}
      note=${NOTE}
      onPointerMove=${move} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setOn(null)}>
      <div class="plate">
        <div class="find">
          <label class="find-head" for="find"><span class="find-name">Find an album</span><span class="count" aria-hidden="true">${count}</span></label>
          <input id="find" type="search" placeholder="Title, artist or rank" autocomplete="off" spellcheck="false"
            onInput=${(e) => search(e.currentTarget.value)} onKeyDown=${keys}>
          <button type="button" aria-label="Previous match" disabled=${() => matches().length < 2} onClick=${() => step(-1)}>↑</button>
          <button type="button" aria-label="Next match" disabled=${() => matches().length < 2} onClick=${() => step(1)}>↓</button>
        </div>
        <p class="say" aria-hidden="true">
          <b class="no"><small>No.</small>${" "}${() => rankOf(album())}</b>
          <span class="t">${() => album().title}</span>
          <span class="by">${() => [album().artist, album().year].filter(Boolean).join(", ")}</span>
          <span class="sold">${() => millions.format(album().copies)} million copies</span>
        </p>
        <p class="sr" role="status">${status}</p>
      </div>
      <div class="stage">
        ${ROWS.length ? html`
        <${Chart} scale=${[scale.min, scale.max]} ticks=${false} theme=${THEME}
          label=${`Copies sold by ${LISTED}, in millions`}>
          <${Plot} rows=${ROWS} keyboard=${true} ref=${(el) => (plot = el)} unit=${unit}
            lit=${(d) => shown() === d.index} miss=${(d) => matches().length > 0 && !matched().has(d.index)}>${Album}<//>
        <//>` : html`<p class="empty">No albums yet: add them to ALBUMS at the top of this file.</p>`}
      </div>
    <//>`;
}

render(() => html`<${BestSellers} />`, document.getElementById("chart"));
</script>
</body>
</html>
