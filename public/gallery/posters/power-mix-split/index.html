  .meter .big small { margin-left: 4px; font: 600 14px/1 var(--text); color: var(--soft); }

];
const REST = { key: "rest", name: "Bioenergy & other", short: "Other", color: "#838c86" }; // quiet: the clean power the request did not name
const SOURCES = [...FOSSIL, ...CLEAN, REST];
const COPPER = "#b0602a"; // the busbar
// The order the segments run from 0: oil, gas, coal to the left; nuclear, hydro, wind, solar, rest to the right
const STACK_KEYS = ["oil", "gas", "coal", "nuclear", "hydro", "wind", "solar", "rest"];
const STACK_COLORS = STACK_KEYS.map((k) => SOURCES.find((s) => s.key === k).color);
const COPPER_TEXT = "#8c4318"; // copper dark enough for words

// Each country's sources as shares of its total, in %, and a copy ranked by clean share: ranks, the dashed line and the
// headline come from the ranked copy, never from the input order
const share = (row) => {
  const [name, short, full, total, ...twh] = row;
  const c = { name, short: short ?? name, full: full ?? name, total };
  SOURCES.forEach((s, i) => (c[s.key] = (twh[i] / total) * 100));
  c.clean = c.nuclear + c.hydro + c.wind + c.solar + c.rest;
  return c;
};
const RANKED = ROWS.map(share).sort((a, b) => b.clean - a.clean);
const COUNT = RANKED.length;
const HALF = RANKED.filter((c) => c.clean > 50).length; // more than half clean: these sit above the dashed line
// All of them together, from the summed TWh: what the meter shows before a country is picked
const ALL = share(["All " + COUNT + " together", null, null, ...ROWS[0].slice(3).map((_, i) => ROWS.reduce((sum, r) => sum + r[3 + i], 0))]);

const pct = (v) => (v > 0 && v < 0.5 ? "<1%" : Math.round(v) + "%");
const twh = new Intl.NumberFormat("en-US", { maximumSignificantDigits: 3 });
const say = (c) => `${c.full}: ${pct(c.clean)} clean. ` + SOURCES.map((s) => `${s.name.toLowerCase()} ${pct(c[s.key])}`).join(", ") + ".";
const headline = HALF === 0 ? `None of the ${COUNT} biggest power producers runs mostly on clean power`
  : `${HALF} of the ${COUNT} biggest power producers ${HALF === 1 ? "runs" : "run"} mostly on clean power`;

// Slat types.
// A gridline, or the copper busbar at 0, with its numbers above and below the rack and the side names on top
const Mark = slat({
  room: { before: 46, after: 24 },
  css: `
    .line { --rhp-tick-width: 1px; }
    .bus .line { --rhp-tick-width: 4px; }
    .num { --rhp-label-gap: 0px; translate: -50% 0; font-size: 11px; color: var(--rhp-muted); }
    .num.top { top: -19px; }
    .num.bottom { top: calc(100% + 6px); }
    .head { --rhp-label-gap: 0px; top: -42px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .head.left { translate: calc(-100% - 9px) 0; }
    .head.right { translate: 9px 0; }
    .head.left::before { content: "\\25C2  "; }
    .head.right::after { content: "  \\25B8"; }
    .head.col { translate: calc(-100% + 44px) 0; letter-spacing: .04em; text-transform: none; color: var(--rhp-muted); }
    @container (max-width: 496px) { .head { letter-spacing: .06em; } }
  `,
}, (t) => html`
  <div class=${() => (t.at === 0 ? "mark bus" : "mark")}>
    <${Tick} at=${() => t.at} thick=${1} class="line" color=${() => (t.at === 0 ? COPPER : "grid")} />
    <${Show} when=${() => t.at % 50 === 0}>
      <${Label} at=${() => t.at} class="num top">${() => pct(Math.abs(t.at))}<//>
      <${Label} at=${() => t.at} class="num bottom">${() => pct(Math.abs(t.at))}<//>
    <//>
    <${Show} when=${() => t.at === 0}>
      <${Label} at=${0} class="head left">Burned<//>
      <${Label} at=${0} class="head right">Clean<//>
    <//>
    <${Show} when=${() => t.at === 100}>
      <${Label} at=${100} class="head col">clean<//>
    <//>
  </div>`);

// One source's stretch of a country's cable. Each starts 1px after the one before, the first on each side 2px from 0 so
// the busbar shows, and the outermost ends round like a cable's. While a country is picked, the other countries fade.
const Segment = slat({
  inset: 0,
  css: `
    .seg { --rhp-radius: 0px; --rhp-gap: 1px; }
    .seg.first { --rhp-gap: 2px; }
    .seg.end { --rhp-end-radius: 4px; }
    .seg.none { visibility: hidden; }
    .picking .country:not(.on) .seg { opacity: .25; }
  `,
}, (s) => html`<${Bar} from=${() => s.from} to=${() => s.to} color=${() => s.color} class=${() => "seg " + s.cls} />`);

// A country: its name, its cable (a Plot of segments in one band), and its clean share at the end. The first country with
// less than half clean carries the dashed line above it.
const Country = slat({
  thickness: 18,
  room: { start: "auto", end: 44 },
  css: `
    .country { outline: none; }
    .country::before { content: ""; position: absolute; inset: 0 -6px; border-radius: 3px; }
    .country.on::before { background: rgb(176 96 42 / .2); }
    .country:focus-visible::before { box-shadow: inset 0 0 0 2px var(--rhp-ink); }
    .name { font-size: 13px; font-weight: 500; }
    .name .short { display: none; }
    .clean { justify-self: stretch; justify-content: flex-end; font-size: 12px; font-weight: 600; }
    .picking .country:not(.on) .name, .picking .country:not(.on) .clean { color: var(--rhp-muted); }
    .half { position: absolute; left: 0; right: 0; top: -1px; border-top: 1.5px dashed ${COPPER}; pointer-events: none; }
    .tag { --rhp-label-gap: 3px; font-size: 12px; font-weight: 600; color: ${COPPER_TEXT}; pointer-events: none; }
    .tag.up { margin-top: -18px; }
    @container (max-width: 639px) { .tag { display: none; } }
    @container (max-width: 496px) {
      .name { font-size: 12px; }
      .name .long { display: none; }
      .name .short { display: inline; }
    }
  `,
}, (d) => {
  // The cable: oil, gas and coal running left from 0, then nuclear, hydro, wind, solar and the rest running right
  const stack = createMemo(() => {
    const left = [d.oil, d.gas, d.coal];
    const right = [d.nuclear, d.hydro, d.wind, d.solar, d.rest];
    const { from, to } = stackUp([...left.map((v) => (v ? -v : 0)), ...right]);
    const firstOf = (vals, at) => (vals.some((v) => v > 0) ? at + vals.findIndex((v) => v > 0) : -1);
    const lastOf = (vals, at) => (vals.some((v) => v > 0) ? at + vals.findLastIndex((v) => v > 0) : -1);
    const marks = [firstOf(left, 0), firstOf(right, 3)];
    const ends = [lastOf(left, 0), lastOf(right, 3)];
    const cls = from.map((f, i) => (f === to[i] ? "none" : [marks.includes(i) && "first", ends.includes(i) && "end"].filter(Boolean).join(" ")));
    return { from, to, cls };
  });
  return html`
    <div class=${() => (d.on ? "country on" : "country")} data-row=${() => d.index} aria-label=${() => say(d)}>
      <${Label} edge="start" class="name"><span class="long">${() => d.name}</span><span class="short">${() => d.short}</span><//>
      <${Plot} overlap=${true} thick="8px" fuel=${STACK_KEYS} color=${STACK_COLORS}
        from=${() => stack().from} to=${() => stack().to} cls=${() => stack().cls}>${Segment}<//>
      <${Label} edge="end" class="clean">${() => pct(d.clean)}<//>
      <${Show} when=${() => d.index === HALF}>
        <span class="half" aria-hidden="true"></span>
        <${Label} at=${-100} class="tag up" aria-hidden="true">↑ ${HALF} mostly clean<//>
        <${Label} at=${100} side="before" class="tag down" aria-hidden="true">${COUNT - HALF} mostly burned ↓<//>
      <//>
    </div>`;
});

// Chart component: the app holds the pick (the rank of the country the reader is on), the Plot turns it into a class
function PowerMix() {
  const [on, setOn] = createSignal(null);
  const shown = () => (on() == null ? ALL : RANKED[on()]);
  // A phone's meter names a country as the list does, and the narrowest gives the rank and the output alone: the full
  // forms are cut there
  const media = (query) => {
    const list = matchMedia(query);
    const [matches, setMatches] = createSignal(list.matches);
    list.addEventListener("change", (e) => setMatches(e.matches));
    return matches;
  };
  const phone = media("(max-width: 560px)");
  const narrowest = media("(max-width: 380px)");
  // The row of the slat an element is in, or null (between slats, on the scale, the text or the meter)
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A mouse or a pen picks as it moves, a tap or a click picks, the keyboard picks; on no country the pick stays
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setOn(row);
  };
  // Leaving the panel: back to the country that has focus (a keyboard's or a click's pick), or none
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    setOn(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  const item = (s) => html`
    <li class=${s.key} style=${"--c: " + s.color}><i></i><span><span class="long">${s.name}</span><span class="short">${s.short ?? s.name}</span></span><b>${() => pct(shown()[s.key])}</b></li>`;
  return html`
    <${Poster}
      kicker="Electricity, burned or clean"
      title=${headline}
      dek="Shares of each country’s electricity in 2024: what it burns runs left of the copper line, its clean power right of it. Above the dashed line, more than half is clean."
      note=${NOTE}
      onPointerMove=${(e) => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setOn(null)}>
      <div class=${() => (on() == null ? "meter" : "meter picked")} aria-hidden="true">
        <p class="who" style="margin: 0"><b>${() => (phone() ? shown().name : shown().full)}</b><span>${() => (on() == null ? "Point at, tap or Tab to a country" : narrowest() ? `No. ${on() + 1} · ${twh.format(shown().total)} TWh` : `No. ${on() + 1} of ${COUNT} · ${twh.format(shown().total)} TWh in 2024`)}</span></p>
        <p class="big" style="margin: 0">${() => pct(shown().clean)}<small>clean</small></p>
        <ul>
          <li class="group g-fossil">Burned</li>
          ${FOSSIL.map((s) => item(s))}
          <li class="group g-clean">Clean</li>
          ${CLEAN.map((s) => item(s))}
          ${item(REST)}
        </ul>
      </div>
      <div class="stage">
        <${Chart} scale=${[-100, 100]}
          label=${`Electricity generated in 2024 by source, as shares of each total, in the ${COUNT} countries and territories that generated the most, ranked by clean share`}
          theme=${{ font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)" }}>
          <${Scale} ticks=${[-100, -75, -50, -25, 0, 25, 50, 75, 100]}>${Mark}<//>
          <${Plot} rows=${RANKED} keyboard=${true} class=${() => (on() != null ? "picking" : "")} on=${(d) => on() === d.index}>${Country}<//>
        <//>
      </div>
    <//>`;
}

render(() => html`<${PowerMix} />`, document.getElementById("chart"));
</script>
</body>
</html>
