  .poster .headline { max-width: 17em; font: 800 clamp(30px, 4.6vw, 48px)/1.04 var(--display); letter-spacing: -.012em; text-wrap: balance; }
  .poster .dek { max-width: 60ch; font-size: 17px; line-height: 1.5; color: var(--soft); }

  @media (min-width: 1000px) {
    .poster figcaption { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: end; }

  /* The key: what a lamp and the band mean */
  .key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; margin: 0 0 16px; font-size: 13px; line-height: 1.3; color: var(--soft); }
  .key span { display: inline-flex; align-items: center; gap: 8px; }

  .readout { display: grid; grid-template-columns: auto minmax(0, max-content) minmax(240px, 1fr); align-items: center; gap: 8px 32px;

  .readout > .rhp-chart { justify-self: center; width: 240px; margin-block: -9px -5px; translate: -16px 0; }

  .hint { font-size: 12px; line-height: 1.3; color: var(--soft); }
  .picker { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .picker select { min-width: 0; max-width: 100%; padding: 0 22px 0 2px; border: 0; border-radius: 3px; appearance: none; cursor: pointer;

  .picker select option, .picker select optgroup { background: var(--paper); color: var(--ink); font: 500 15px var(--text); }
  .step { display: grid; flex: none; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--soft); border-radius: 50%; background: none; color: var(--ink); font: 700 18px/1 var(--display); cursor: pointer; }

  .facts { display: grid; gap: 2px; margin: 0; font-size: 14px; line-height: 1.35; color: var(--soft); font-variant-numeric: tabular-nums; }
  .facts span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// What the text and the readout read, computed from the data
const STATIONS = LINES.flatMap((line, l) => line.stations.map(([name, riders, area], p) => {
  const peak = Math.max(...riders);
  return {
    name, riders, p, line: l, no: line.no, color: line.color, last: p === line.stations.length - 1, downtown: area === "downtown",
    peak, hour: riders.indexOf(peak), total: riders.reduce((sum, v) => sum + v, 0), level: riders.map((v) => (peak > 0 ? v / peak : 0)),
  };
}));
STATIONS.forEach((s, id) => (s.id = id));
const count = new Intl.NumberFormat("en-US");
const clock = (h) => `${h % 12 || 12} ${h % 24 < 12 ? "am" : "pm"}`;
const hourSpan = (h) => {
  const a = h % 24, b = (h + 1) % 24, n = (x) => x % 12 || 12, ap = (x) => (x < 12 ? "am" : "pm");
  return ap(a) === ap(b) ? `${n(a)} to ${n(b)} ${ap(b)}` : `${n(a)} ${ap(a)} to ${n(b)} ${ap(b)}`;
};
const ends = (s) => s.p < 5 || s.p >= LINES[s.line].stations.length - 5; // the five stops nearest each end of a line
const morning = (s) => s.hour < 12;
const mode = (hours) => {
  const tally = {};
  for (const h of hours) tally[h] = (tally[h] ?? 0) + 1;
  return +Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
};
const END = STATIONS.filter(ends);
const DOWN = STATIONS.filter((s) => s.downtown);
const endsAM = END.filter(morning);
const downPM = DOWN.filter((s) => !morning(s));
const pattern = endsAM.length >= 0.75 * END.length && downPM.length >= 0.75 * DOWN.length;
const TITLE = pattern
  ? `The ends of the lines rush at ${clock(mode(endsAM.map((s) => s.hour)))}, downtown at ${clock(mode(downPM.map((s) => s.hour)))}`
  : `${STATIONS.filter(morning).length} of ${STATIONS.length} stations are busiest before noon`;
const DEK = `Riders entering ${STATIONS.length} stations of an invented subway, hour by hour on an average weekday. `
  + `Of the ${END.length} stops nearest the ends of the lines, ${endsAM.length} are busiest before noon; `
  + `${downPM.length === DOWN.length ? `all ${DOWN.length}` : `${downPM.length} of the ${DOWN.length}`} downtown stops are busiest after it.`;
const LEAD = STATIONS.reduce((a, b) => (b.peak > a.peak ? b : a)).id; // the busiest station hour of the network: shown at rest
const TOP = nice(0, Math.max(...STATIONS.map((s) => s.peak))).max; // one scale for every station's hourly bars
const busiest = (s) => (s.peak > 0 ? `busiest ${hourSpan(s.hour)} with ${count.format(s.peak)} riders` : "no riders");
const say = (s) => `${s.name}, line ${s.no}${s.downtown ? ", downtown" : ""}: ${busiest(s)}, ${count.format(s.total)} riders all day`;
STATIONS.forEach((s) => (s.say = say(s)));

// The page's tokens, read by every chart
const THEME = {
  font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)",
  series: ["var(--accent)", "var(--amber-dim)"], low: "var(--lamp-off)", high: "var(--lamp-on)",
};

// Slat types
// An hour of a station: one lamp, lit from the theme's low to its high by the share of the station's busiest hour.
// The first station of a line carries the clock above the lamps, every third hour.
const Hour = slat({
  css: `
    .lamp { --rhp-cell-gap: 1px; --rhp-radius: 2px; }
    .clock { overflow: visible; text-overflow: clip; font: 500 11px/1 "Overpass Mono", ui-monospace, Menlo, monospace; color: var(--rhp-muted); pointer-events: none; --rhp-label-gap: 5px; }
  `,
}, (h) => html`
  <div>
    <${Cell} value=${() => h.level} class="lamp" />
    <${Show} when=${() => h.top && h.index % 3 === 0}>
      <${Label} edge="end" class="clock">${() => h.index}<//>
    <//>
  </div>`);

// A station: its stop on the line's strip map and its name in the start room, then its 24 lamps. Downtown stops sit
// on a lighter band. Two sizes of start room: a phone's and a wider screen's.
const station = (start) => slat({
  thickness: 18,
  room: { start, end: 6, before: 18 },
  css: `
    .stop { cursor: pointer; outline: none; }
    .stop::before { content: ""; position: absolute; top: 0; bottom: 0; left: ${6 - start}px; width: 3px; background: var(--line); }
    .stop.first::before { top: 50%; }
    .stop.last::before { bottom: 50%; }
    .stop::after { content: ""; position: absolute; top: 50%; left: ${7.5 - start}px; width: 10px; height: 10px; translate: -50% -50%; border: 2px solid var(--line); border-radius: 50%; background: var(--rhp-surface); box-sizing: border-box; }
    .downtown { background: color-mix(in oklab, var(--rhp-ink) 6%, var(--rhp-surface)); box-shadow: ${-start}px 0 0 color-mix(in oklab, var(--rhp-ink) 6%, var(--rhp-surface)), 6px 0 0 color-mix(in oklab, var(--rhp-ink) 6%, var(--rhp-surface)); }
    .name { justify-content: flex-start; text-align: left; padding-left: 19px; font-size: 12px; font-weight: 600; color: var(--rhp-muted); }
    .ring { display: none; position: absolute; z-index: 2; inset: -1px -3px; border: 2px solid var(--rhp-ink); border-radius: 4px; pointer-events: none; }
    .lit .ring { display: block; }
    .stop:focus-visible .ring { display: block; inset: -3px -5px; border: 3px solid var(--rhp-series-1); }
    .lit .name { color: var(--rhp-ink); font-weight: 800; }
    .lit::after { background: var(--rhp-ink); }
  `,
}, (d) => html`
  <div class=${() => "stop" + (d.p === 0 ? " first" : "") + (d.last ? " last" : "") + (d.downtown ? " downtown" : "") + (d.lit ? " lit" : "")}
    data-row=${() => d.id} style=${() => ({ "--line": d.color })} aria-label=${() => d.say}>
    <${Label} edge="start" class="name">${() => d.name}<//>
    <${Plot} orientation="across" level=${() => d.level} top=${() => d.p === 0}>${Hour}<//>
    <i class="ring"></i>
  </div>`);
const StationWide = station(124);
const StationNarrow = station(112);

// An hour in the readout: the shown station's riders, on one scale for every station; its busiest hour lit
const Hourly = slat({
  inset: 0.14,
  room: { start: 20, end: 2 },
  css: `
    .bar { --rhp-radius: 1px; }
    .t { overflow: visible; text-overflow: clip; font: 500 11px/1 "Overpass Mono", ui-monospace, Menlo, monospace; color: var(--rhp-muted); }
  `,
}, (m) => html`
  <div>
    <${Bar} to=${() => m.riders} color=${() => (m.top ? "series-1" : "series-2")} class="bar" />
    <${Show} when=${() => m.index % 6 === 0}><${Label} edge="start" class="t">${() => m.index}<//><//>
  </div>`);

// Chart component: pointing at a station previews it; a click, a tap, the keyboard, the picker or its arrows keep it
function Stations() {
  const roomy = matchMedia("(min-width: 560px)");
  const [wide, setWide] = createSignal(roomy.matches);
  const turn = (e) => setWide(e.matches);
  roomy.addEventListener("change", turn);
  onCleanup(() => roomy.removeEventListener("change", turn));
  // The readout's hours are 4px taller where the readout is one row and nothing stands above them (in two rows, the
  // picker's arrow does)
  const above = matchMedia("(min-width: 1000px)");
  const [tall, setTall] = createSignal(above.matches);
  const grow = (e) => setTall(e.matches);
  above.addEventListener("change", grow);
  onCleanup(() => above.removeEventListener("change", grow));
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const [held, setHeld] = createSignal(LEAD);
  const [hover, setHover] = createSignal(null);
  const shown = () => hover() ?? held();
  const s = () => STATIONS[shown()];
  let picker;
  createEffect(() => picker && (picker.value = String(shown())));

  // The station an element is in, or null (between rows, in a line's head)
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A mouse or a pen previews as it moves; on no station the preview stays; leaving the lines ends it
  const point = (e) => {
    if (e.pointerType === "touch") return;
    const row = rowOf(e.target);
    if (row == null) return;
    setHover(row);
  };
  const keep = (e) => {
    const row = rowOf(e.target);
    if (row == null) return;
    setHeld(row);
    setHover(null);
  };
  // The picker and its arrows keep a station, and bring its row into view under the readout
  const go = (id) => {
    setHeld(Math.max(0, Math.min(STATIONS.length - 1, id)));
    setHover(null);
    document.querySelector(`.lines [data-row="${held()}"]`)?.scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
  };

  return html`
    <${Poster} kicker="Subway riders, an average weekday" title=${TITLE} dek=${DEK} note=${NOTE}>
      <p class="key" aria-hidden="true">
        <span>quiet hour<i class="ramp"></i>the station's busiest</span>
        <span><i class="band"></i>downtown stops</span>
        <span><b>18</b>the hour from 6 to 7 pm</span>
      </p>
      <div class="readout">
        <div class="pick">
          <label class="hint" for="station">Point at a station's row, tap it, or choose it here</label>
          <div class="picker">
            <button type="button" class="step" aria-label="Previous station" disabled=${() => held() === 0} onClick=${() => go(held() - 1)}>‹</button>
            <i class="bullet" style=${() => ({ "--line": s().color })} aria-hidden="true">${() => s().no}</i>
            <select id="station" ref=${(el) => (picker = el)} onChange=${(e) => go(+e.currentTarget.value)}>
              ${LINES.map((line, l) => {
                const rows = STATIONS.filter((x) => x.line === l);
                return html`<optgroup label=${`Line ${line.no}: ${rows[0].name} to ${rows.at(-1).name}`}>
                  ${rows.map((x) => html`<option value=${x.id}>${x.name}</option>`)}
                </optgroup>`;
              })}
            </select>
            <button type="button" class="step" aria-label="Next station" disabled=${() => held() === STATIONS.length - 1} onClick=${() => go(held() + 1)}>›</button>
          </div>
        </div>
        <p class="facts" aria-live="polite">
          <span>${() => (s().peak > 0 ? "Busiest " : "No riders")}<b>${() => (s().peak > 0 ? hourSpan(s().hour) : "")}</b></span>
          <span><b>${() => count.format(s().peak)}</b> riders</span>
          <span><b>${() => count.format(s().total)}</b> all day</span>
        </p>
        <${Chart} orientation="vertical" height=${() => (tall() ? 56 : 52)} scale=${[0, TOP]} ticks=${false} theme=${{ ...THEME, surface: "var(--page)" }}
          label=${() => `Riders entering ${s().name} each hour, on one scale for every station`}>
          <${Plot} riders=${() => s().riders} top=${(m) => m.index === s().hour} animate=${["riders"]}>${Hourly}<//>
        <//>
      </div>
      <div class="lines" onPointerMove=${point} onPointerLeave=${(e) => e.pointerType !== "touch" && setHover(null)} onClick=${keep} onFocusIn=${keep}>
        ${LINES.map((line, l) => {
          const rows = STATIONS.filter((x) => x.line === l);
          const from = rows[0].name, to = rows.at(-1).name;
          return html`
            <section style=${{ "--line": line.color }}>
              <h2 class="line-head"><i class="bullet" aria-hidden="true">${line.no}</i><span>Line ${line.no}${" "}<span class="to">${from} to ${to}</span></span></h2>
              <${Chart} scale=${[0, 1]} ticks=${false} theme=${THEME}
                label=${`Line ${line.no}, ${from} to ${to}: riders entering each of its ${rows.length} stations by hour of the day, each station's lamps lit toward its busiest hour`}>
                ${() => html`<${Plot} keyboard=${true} rows=${rows} lit=${(d) => shown() === d.id}>${wide() ? StationWide : StationNarrow}<//>`}
              <//>
            </section>`;
        })}
      </div>
    <//>`;
}

render(() => html`<${Stations} />`, document.getElementById("chart"));
</script>
