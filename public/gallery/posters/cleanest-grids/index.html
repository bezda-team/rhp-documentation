  * { box-sizing: border-box; }

  .poster { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "kicker" "headline" "dek" "stage" "note";

  .poster .note { grid-area: note; display: block; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12.5px; line-height: 1.5; color: var(--soft); }
  .stage { grid-area: stage; min-width: 0; margin-top: 26px; }

  /* The meter: the key and the readout in one. Under 1180px it sits above the list, and while a country is picked it
     stays at the top of the screen as the list scrolls under it. */
  .meter { margin: 0 -8px 10px; padding: 9px 8px 10px; background: var(--paper); }
  .meter.picked { position: sticky; top: 0; z-index: 2; box-shadow: 0 1px 0 var(--rule); }
  .meter p { margin: 0; }
  .meter .who { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 18px/1.2 var(--display); }
  .meter .country { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .meter .share { flex: none; font-variant-numeric: tabular-nums; }
  .meter .share b { color: var(--accent); }
  .meter .mix { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 2px 8px; margin: 6px 0 4px; padding: 0; list-style: none; font: 600 14px/1.3 var(--display); }
  .meter li { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .meter li i { flex: none; width: 10px; height: 10px; border-radius: 1px; }
  .meter li b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .meter li.zero { color: var(--soft); font-weight: 500; }
  .meter li.zero b { font-weight: 500; }
  .meter .hint { font-size: 13px; line-height: 1.35; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* From 1180px the meter stands in a column of its own beside the list, and stays in view as the list scrolls by */
  @media (min-width: 1180px) {
    .poster { max-width: 1180px; padding: 56px 56px 30px; }
    .stage { display: grid; grid-template-columns: 250px minmax(0, 1fr); column-gap: 48px; align-items: start; margin-top: 34px; }
    .plot { grid-column: 2; grid-row: 1; }
    .meter, .meter.picked { position: sticky; top: 28px; grid-column: 1; grid-row: 1; margin: 0; padding: 0; box-shadow: none; }
    .meter .who { display: grid; gap: 6px; }
    .meter .country { min-height: 2lh; font-size: 30px; line-height: 1.02; white-space: normal; }
    .meter .share { font: 600 15px/1 var(--text); color: var(--soft); }

    .meter .mix { grid-template-columns: 1fr; gap: 0; margin: 16px 0 12px; font-size: 17px; }
    .meter li { padding: 4px 0; border-top: 1px solid var(--rule); }
    .meter li:nth-child(5) { border-top: 2px solid var(--ink); }
    .meter li i { width: 12px; height: 12px; }
    .meter .hint { white-space: normal; }
  }
  .poster :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

];
const COLUMNS = ["coal", "gas", "oil", "nuclear", "hydro", "wind", "solar", "other"];
const NOTE = "Source: Ember, yearly electricity data (2026 release), for 2024, the latest year it covers for all 100 countries and territories. Clean means every source but coal, oil and gas, as Ember counts it, so the gray part of a bar (bioenergy, geothermal and other renewables) is clean too. Oil is Ember's “other fossil”, which is mostly oil.";

// The sources from the left of each bar: the clean ones, then the fossil ones. Other clean sources go between them in gray.
const SOURCES = [
  { key: "hydro", name: "Hydro", color: "#2f6fb8" },
  { key: "nuclear", name: "Nuclear", color: "#4b2e83" },
  { key: "wind", name: "Wind", color: "#5cb8a4" },
  { key: "solar", name: "Solar", color: "#f2c230" },
  { key: "coal", name: "Coal", color: "#24211e" },
  { key: "oil", name: "Oil", color: "#7a4127" },
  { key: "gas", name: "Gas", color: "#e8873f" },
];
const OTHER = "#a9aea5";
const STACK = ["hydro", "nuclear", "wind", "solar", "other", "coal", "oil", "gas"];
const COLOR = { ...Object.fromEntries(SOURCES.map((s) => [s.key, s.color])), other: OTHER };
const SEAM = STACK.indexOf("other"); // clean runs out at the end of this part
const SHORT = { "Bosnia and Herzegovina": "Bosnia & Herz.", "Dominican Republic": "Dominican Rep.", "United Arab Emirates": "UAE", "Türkiye (Turkey)": "Türkiye" };

// Each country's mix as shares of its generation, laid end to end, and its clean share (where the clean parts end)
const mix = (name, twh) => {
  const share = shares(STACK.map((k) => twh[k]));
  const { from, to } = stackUp(share);
  return {
    name, short: SHORT[name] ?? name,
    pct: Object.fromEntries(STACK.map((k, i) => [k, share[i]])),
    from, to: to.map((v) => Math.min(100, v)),
    clean: Math.min(100, to[SEAM]),
  };
};
const read = (row) => Object.fromEntries(COLUMNS.map((k, i) => [k, row[i + 1]]));
// A sorted copy, cleanest first (ties keep the larger producer first); ranks and the dek come from it
const COUNTRIES = GENERATION.map((row) => mix(row[0], read(row))).sort((a, b) => b.clean - a.clean);
const total = Object.fromEntries(COLUMNS.map((k) => [k, GENERATION.reduce((sum, row) => sum + read(row)[k], 0)]));
const ALL = mix("All 100 together", total);

const percent = (v) => (v > 0 && v < 0.5 ? "<1%" : v >= 99.5 && v < 100 ? ">99%" : Math.round(v) + "%");
const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] ?? "th");
const rankOf = (r) => {
  const rank = 1 + COUNTRIES.filter((c) => c.clean > r.clean).length;
  const tied = COUNTRIES.some((c) => c !== r && c.clean === r.clean);
  return `${ordinal(rank)} cleanest of ${COUNTRIES.length}${tied ? ", tied" : ""}`;
};
// The largest of the seven named sources in a country
const largest = (r) => SOURCES.reduce((a, s) => (r.pct[s.key] > r.pct[a.key] ? s : a)).key;
const hydroTop = COUNTRIES.slice(0, 10).filter((r) => largest(r) === "hydro").length;
const gasLow = COUNTRIES.slice(-20).filter((r) => largest(r) === "gas").length;
const say = (r) => `${r.name}: ${percent(r.clean)} clean; ` + SOURCES.map((s) => `${s.name.toLowerCase()} ${percent(r.pct[s.key])}`).join(", ");

// The chart's font and colors, read from the page's tokens
const THEME = { font: "var(--text)", ink: "var(--ink)", muted: "var(--soft)", grid: "var(--rule)", surface: "var(--paper)", series: ["var(--accent)"] };

// Slat types: a country is its name, its parts end to end, an ink seam where its clean power runs out, and its clean share.
// The frame behind the parts draws the ring of the country picked.
const Country = slat({

  inset: "3px",
  room: { start: "auto", end: 44 },
  css: `

    .name { font-size: 13px; font-weight: 500; --rhp-label-gap: 10px; }
    .name .short { display: none; }
    .frame { --rhp-radius: 0px; background: none; }
    .row:is(.on, :focus-visible) .frame { box-shadow: 0 0 0 1px var(--rhp-surface), 0 0 0 3px var(--rhp-ink); }
    .seg { --rhp-radius: 0px; }
    .after { --rhp-gap: 1px; }
    .seam { --rhp-tick-width: 2px; }
    .clean { font-size: 13px; font-weight: 600; --rhp-label-gap: 8px; }
    .on .name, .on .clean { color: var(--rhp-series-1); }
    .dim :is(.seg, .seam) { opacity: .3; }
    .dim :is(.name, .clean) { color: var(--rhp-muted); }
    @container (max-width: 480px) {
      .name { font-size: 12px; --rhp-label-gap: 7px; }
      .name .long { display: none; }
      .name .short { display: inline; }
      .clean { font-size: 12px; --rhp-label-gap: 6px; }
    }
  `,
}, (d) => html`
  <div class=${() => (d.on ? "row on" : d.dim ? "row dim" : "row")} data-row=${() => d.index} aria-label=${() => say(d)}>
    <${Label} edge="start" class="name"><span class="long">${() => d.name}</span><span class="short">${() => d.short}</span><//>
    <${Bar} from=${0} to=${100} class="frame" />
    ${STACK.map((key, k) => html`<${Bar} from=${() => d.from[k]} to=${() => d.to[k]} color=${COLOR[key]} class=${k > 0 ? "seg after" : "seg"} />`)}
    <${Tick} at=${() => d.clean} thick=${1} color="ink" class="seam" />
    <${Label} edge="end" class="clean">${() => percent(d.clean)}<//>
  </div>`);

// The scale, drawn above and below the list: hairlines every 25%, and a head over the clean shares
const Mark = slat({
  room: { before: 24, after: 24 },
  css: `

    .num { font-size: 11px; color: var(--rhp-muted); translate: -50% 0; --rhp-label-gap: 0px; }

    .bottom { top: calc(100% + 7px); }
    .head { translate: 0 0; --rhp-label-gap: 8px; font-weight: 600; color: var(--rhp-ink); }

    <${Tick} at=${() => t.at} thick=${1} color="grid" class="grid" />
    <${Label} at=${() => t.at} class=${() => (t.last ? "num top head" : "num top")}>${() => (t.last ? "clean" : t.at + "%")}<//>
    <${Label} at=${() => t.at} class="num bottom">${() => t.at}%<//>

// Half of a country's power: a dashed line over every bar
const Half = slat({
  room: {},
  css: `.half { --rhp-tick-width: 1px; background: repeating-linear-gradient(0deg, var(--rhp-ink) 0 3px, transparent 3px 7px); opacity: .45; }`,
}, (h) => html`<${Tick} at=${() => h.at} thick=${1} class="half" />`);

// Chart component: the country the reader points at, taps or reaches with the keyboard is lit, and the meter reads it out
function PowerMix() {
  const [on, setOn] = createSignal(null);
  const shown = createMemo(() => (on() == null ? ALL : COUNTRIES[on()]));
  // The row of the slat an element is in, or null (between slats, on the meter or the text)
  const rowOf = (el) => {
    const root = el.closest("[data-row]");
    return root ? +root.dataset.row : null;
  };
  // A mouse or a pen picks as it moves, a tap or a click picks, the keyboard picks; on no country the pick stays
  const pick = (e) => {
    const row = rowOf(e.target);
    if (row != null) setOn(row);
  };
  // Leaving the poster: back to the country that has focus, or none
  const leave = (e) => {
    if (e.pointerType === "touch") return; // a finger sends pointerleave as it lifts after a tap
    setOn(e.currentTarget.contains(document.activeElement) ? rowOf(document.activeElement) : null);
  };
  return html`
    <${Poster}
      kicker="Electricity by source, 2024"
      title="The cleanest grids run on rivers, the least clean on gas"
      dek=${`Where the 100 biggest power producers got their electricity in 2024, sorted by the share from clean sources. Hydro is the largest source in ${hydroTop} of the 10 cleanest, gas in ${gasLow} of the 20 least clean.`}
      note=${NOTE}
      onPointerMove=${(e) => e.pointerType !== "touch" && pick(e)} onClick=${pick} onFocusIn=${pick}
      onPointerLeave=${leave} onFocusOut=${(e) => !e.currentTarget.contains(e.relatedTarget) && setOn(null)}>
      <div class="stage">
        <div class=${() => (on() == null ? "meter" : "meter picked")} aria-hidden="true">
          <p class="who"><span class="country">${() => shown().name}</span><span class="share"><b>${() => percent(shown().clean)}</b> clean</span></p>
          <ul class="mix">
            ${SOURCES.map((s) => html`
              <li class=${() => (shown().pct[s.key] === 0 ? "zero" : "")}><i style=${"background: " + s.color}></i>${s.name}<b>${() => percent(shown().pct[s.key])}</b></li>`)}
          </ul>
          <p class="hint">${() => (on() == null ? "Point at or tap a country to read its mix." : rankOf(shown()))}</p>
        </div>
        <div class="plot">
          <${Chart} scale=${[0, 100]} theme=${THEME}
            label="Electricity generated in 2024 by source, as shares of each country's total, for the 100 countries and territories that generate the most, cleanest first">
            <${Scale} ticks=${[0, 25, 50, 75, 100]}>${Mark}<//>
            <${Plot} rows=${COUNTRIES} keyboard=${true} on=${(d) => on() === d.index} dim=${(d) => on() != null && on() !== d.index}>${Country}<//>
            <${Plot} overlap=${true} slats=${1} at=${50} style=${{ "pointer-events": "none" }}>${Half}<//>
          <//>
        </div>
      </div>
    <//>`;
}

render(() => html`<${PowerMix} />`, document.getElementById("chart"));
</script>
</body>
</html>
